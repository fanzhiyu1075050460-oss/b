name: Build APK

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:与:
          channel: stable通道: 稳定版

      - name: Install dependencies      - 名称: 安装依赖
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release运行: flutter build apk --release

      - name: Upload APK      - 名称: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk名称: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk路径: build/app/outputs/flutter-apk/app-release.apk
